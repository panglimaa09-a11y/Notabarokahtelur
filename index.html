<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barokah Telur V18.1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#frame{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="frame" title="Barokah Telur V18.1"></iframe>
<script>
(async()=>{
  const frame=document.getElementById('frame');
  try{
    const r=await fetch('https://raw.githubusercontent.com/panglimaa09-a11y/Notabarokahtelur/30bd08174624d3a440b801df231f80082f2ed7dc/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    frame.srcdoc=await r.text();
  }catch(e){
    frame.srcdoc='<html><body style="font-family:system-ui;padding:24px"><h2>Gagal memuat Nota</h2><p>'+String(e.message||e).replace(/[<>]/g,'')+'</p></body></html>';
  }
})();
</script>
</body>
</html>

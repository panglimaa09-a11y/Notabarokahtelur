<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barokah Telur V18.1 Preview</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff}#frame{width:100%;height:100%;border:0}#status{font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#555}</style>
</head>
<body>
<div id="status">Memuat V18.1 Preview…</div>
<iframe id="frame" title="Barokah Telur V18.1" style="display:none;width:100%;height:100%;border:0"></iframe>
<script>
(async()=>{
  const status=document.getElementById('status'), frame=document.getElementById('frame');
  try{
    const r=await fetch('https://raw.githubusercontent.com/panglimaa09-a11y/Notabarokahtelur/main/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const patch = `<script>
(function(){
  function wire(){
    const payments=document.getElementById('payments');
    const installments=document.getElementById('installments');
    if(payments && !document.getElementById('preview-add-payment')){
      const b=document.createElement('button');
      b.id='preview-add-payment'; b.className='btn btn-light add-row'; b.textContent='＋  Tambah Pembayaran';
      b.onclick=()=>{ if(typeof addPayment==='function') addPayment(); };
      payments.after(b);
    }
    if(installments && !document.getElementById('preview-add-installment')){
      const b=document.createElement('button');
      b.id='preview-add-installment'; b.className='btn btn-light add-row'; b.textContent='＋  Tambah Cicilan';
      b.onclick=()=>{
        if(typeof installments!=='undefined' && typeof renderInstallments==='function'){
          installments.push({description:'',amount:0,date:typeof today==='function'?today():'',status:'BELUM DIBAYAR'});
          renderInstallments();
          setTimeout(wire,0);
        }
      };
      installments.after(b);
    }
    document.querySelectorAll('#payments select').forEach(sel=>{
      if(!Array.from(sel.options).some(o=>o.value==='CICILAN')){
        const o=document.createElement('option'); o.value='CICILAN'; o.textContent='Cicilan'; sel.appendChild(o);
      }
    });
  }
  wire();
  const mo=new MutationObserver(wire);
  mo.observe(document.body,{childList:true,subtree:true});
})();
<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    frame.srcdoc=html;
    frame.style.display='block';
    status.style.display='none';
  }catch(e){
    status.textContent='Gagal memuat V18.1: '+(e.message||e);
  }
})();
</script>
</body>
</html>

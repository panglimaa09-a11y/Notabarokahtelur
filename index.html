<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barokah Telur V18.1 Preview</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff}#frame{width:100%;height:100%;border:0}#status{font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#555}</style>
</head>
<body>
<div id="status">Memuat V18.1 Preview…</div>
<iframe id="frame" title="Barokah Telur V18.1" style="display:none;width:100%;height:100%;border:0"></iframe>
<script>
(async()=>{
  const status=document.getElementById('status'), frame=document.getElementById('frame');
  try{
    const r=await fetch('https://raw.githubusercontent.com/panglimaa09-a11y/Notabarokahtelur/main/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    frame.srcdoc=html;
    frame.onload=()=>{
      try{
        const win=frame.contentWindow, doc=frame.contentDocument;
        function removeSeparateCicilan(){
          doc.querySelectorAll('.installment-title, #installments, .installment-note, .installment-print-title').forEach(el=>el.remove());
          doc.querySelectorAll('[onclick*="addInstallment"], [id*="installment"] button').forEach(el=>el.remove());
        }
        function addCicilanType(){
          doc.querySelectorAll('#payments select').forEach(sel=>{
            if(!Array.from(sel.options).some(o=>o.value==='CICILAN')){
              const o=doc.createElement('option');o.value='CICILAN';o.textContent='Cicilan';sel.appendChild(o);
            }
          });
        }
        function addPaymentButton(){
          const el=doc.getElementById('payments');
          if(!el || doc.getElementById('preview-add-payment')) return;
          const b=doc.createElement('button');
          b.id='preview-add-payment'; b.className='btn btn-light add-row';
          b.textContent='＋  Tambah Pembayaran';
          b.onclick=()=>{ if(typeof win.addPayment==='function') win.addPayment(); };
          el.after(b);
        }
        function migrateInstallments(){
          if(!Array.isArray(win.installments)||!win.installments.length||!Array.isArray(win.payments)) return;
          const moved=win.installments.map(x=>({type:'CICILAN',description:x.description||'Cicilan',amount:Number(x.amount)||0,date:x.date||((typeof win.today==='function')?win.today():'')}));
          win.payments=win.payments.concat(moved);
          win.installments=[];
          if(typeof win.renderPayments==='function') win.renderPayments();
          if(typeof win.update==='function') win.update();
        }
        migrateInstallments();
        removeSeparateCicilan();
        addPaymentButton();
        addCicilanType();
        const obs=new MutationObserver(()=>{
          removeSeparateCicilan();
          addPaymentButton();
          addCicilanType();
        });
        obs.observe(doc.body,{childList:true,subtree:true});
        status.style.display='none'; frame.style.display='block';
      }catch(e){ status.textContent='Preview gagal diterapkan: '+(e.message||e); }
    };
  }catch(e){ status.textContent='Gagal memuat V18.1: '+(e.message||e); }
})();
</script>
</body>
</html>

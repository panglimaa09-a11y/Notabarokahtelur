<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barokah Telur V18.1 Preview</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff}#status{font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#555}</style>
</head>
<body>
<div id="status">Memuat V18.1 Preview…</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const r=await fetch('https://raw.githubusercontent.com/panglimaa09-a11y/Notabarokahtelur/main/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.textContent='Gagal memuat V18.1: '+e.message;
  }
})();
</script>
</body>
</html>

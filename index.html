<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Barokah Telur V18.1 Preview</title>
</head>
<body>
<div style="font-family:system-ui;padding:24px;text-align:center">Memuat V18.1…</div>
<script>
(async()=>{
  try{
    const r=await fetch('https://raw.githubusercontent.com/panglimaa09-a11y/Notabarokahtelur/main/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h2>Preview V18.1 gagal dimuat</h2><p>'+String(e.message||e)+'</p><p>Branch preview tidak mengubah main.</p></div>';
  }
})();
</script>
</body>
</html>
